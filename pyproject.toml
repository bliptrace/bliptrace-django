[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bliptrace-django"
version = "1.0.0"
description = "Django adapter for the Bliptrace error-capture platform — middleware over the Bliptrace Python SDK"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Developers Hub Sdn Bhd" }]
keywords = ["bliptrace", "django", "error", "observability", "monitoring", "telemetry"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "Topic :: System :: Monitoring",
]
# NOTE: ``bliptrace`` is the local/unpublished runtime SDK in ../bliptrace-python.
# Until it is published, install it editable for development and tests:
#     python3 -m pip install --user -e ../bliptrace-python
dependencies = ["bliptrace"]

[project.optional-dependencies]
dev = ["pytest", "django"]

[project.urls]
Homepage = "https://bliptrace.com"
Repository = "https://github.com/bliptrace/bliptrace-django"

[tool.setuptools.packages.find]
include = ["bliptrace_django*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
